<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primal Shores</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --acc: #f2b33d; --acc-dim: #a87a24; --ink: #eef3e6; --panel: rgba(12,18,14,.86); --edge: #3d5a3a;
    --hp: #e0524a; --st: #e8d24a; --fd: #d9884a; --wt: #4aa8e0; --xp: #9b6cf0; --good: #7fd36b; --bad: #ef6457;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08131c; color: var(--ink);
    font-family: Inter, system-ui, sans-serif; user-select: none; }
  canvas#c { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .hide { display: none !important; }
  .hud { position: fixed; z-index: 5; }
  #stats { left: 14px; bottom: 14px; width: 250px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: 10px 12px; font-size: 12px; }
  .bar { position: relative; height: 14px; background: rgba(255,255,255,.08); border-radius: 7px; margin: 5px 0; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 7px; transition: width .15s; }
  .bar span { position: relative; padding-left: 8px; font-size: 10px; font-weight: 700; line-height: 14px; text-shadow: 0 1px 2px #000; }
  #lvl { display: flex; justify-content: space-between; font: 22px 'Bebas Neue', sans-serif; letter-spacing: 1px; color: var(--acc); }
  #lvl small { font: 600 11px Inter; color: #b9c6b0; align-self: center; }
  #hotbar { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; }
  .slot { width: 58px; height: 58px; background: var(--panel); border: 2px solid var(--edge); border-radius: 9px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; }
  .slot.sel { border-color: var(--acc); box-shadow: 0 0 12px rgba(242,179,61,.55); }
  .slot .i { font-size: 24px; line-height: 1; }
  .slot .k { position: absolute; top: 2px; left: 5px; font-size: 10px; color: #9fb196; }
  .slot .q { position: absolute; bottom: 2px; right: 5px; font-size: 10px; font-weight: 700; color: var(--acc); }
  .slot .n { font-size: 8.5px; margin-top: 3px; color: #cfdac8; white-space: nowrap; max-width: 54px; overflow: hidden; text-overflow: ellipsis; }
  #prompt { left: 50%; bottom: 86px; transform: translateX(-50%); font-size: 13px; font-weight: 600; text-align: center;
    pointer-events: none; text-shadow: 0 1px 4px #000; }
  #prompt div { background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 14px; margin-top: 4px; display: inline-block; }
  #prompt b { color: var(--acc); }
  #log { left: 14px; top: 14px; width: 380px; pointer-events: none; font-size: 13px; }
  #log div { background: rgba(8,14,10,.72); border-left: 3px solid var(--acc); padding: 5px 9px; margin-bottom: 4px; border-radius: 0 6px 6px 0; }
  #log div.bad { border-left-color: var(--bad); } #log div.ok { border-left-color: var(--good); } #log div.lv { border-left-color: var(--xp); }
  #goal { left: 14px; top: auto; bottom: 200px; width: 250px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; pointer-events: none; }
  #goal h5 { margin: 0 0 3px; font: 16px 'Bebas Neue'; letter-spacing: 1.5px; color: var(--acc); }
  #tr { right: 14px; top: 14px; width: 190px; display: flex; flex-direction: column; gap: 6px; }
  #clock { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 5px 10px; font: 20px 'Bebas Neue'; letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: center; }
  #clock small { font: 600 11px Inter; color: #aebba6; }
  #mini { width: 190px; height: 190px; border: 2px solid var(--edge); border-radius: 10px; background: #0b2d4a; cursor: pointer; }
  #tames { font-size: 11px; }
  #tames .t { background: var(--panel); border: 1px solid var(--edge); border-radius: 7px; padding: 4px 7px; margin-bottom: 4px; }
  #tames .t .bar { height: 5px; margin: 3px 0 0; }
  #boss { left: 50%; top: 18px; transform: translateX(-50%); width: min(520px, 70vw); text-align: center; }
  #boss .nm { font: 26px 'Bebas Neue'; letter-spacing: 3px; color: #ff8a5a; text-shadow: 0 0 12px #c0301a; }
  #boss .bar { height: 12px; border: 1px solid #7a2a1a; }
  #mountbar { left: 50%; top: 70px; transform: translateX(-50%); width: 260px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 8px; padding: 5px 10px; font-size: 11px; text-align: center; }
  #hurt { position: fixed; inset: 0; z-index: 4; pointer-events: none; box-shadow: inset 0 0 160px rgba(200,20,20,.8); opacity: 0; transition: opacity .25s; }

  .panel { position: fixed; z-index: 12; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(980px, 96vw); height: min(620px, 88vh);
    background: rgba(10,16,12,.95); border: 1px solid var(--edge); border-radius: 14px; display: flex; gap: 14px; padding: 16px; }
  .panel .col { display: flex; flex-direction: column; min-width: 0; }
  .panel h3 { margin: 0 0 8px; font: 26px 'Bebas Neue'; letter-spacing: 2px; color: var(--acc); display: flex; justify-content: space-between; align-items: baseline; }
  .panel h3 small { font: 500 11px Inter; color: #9fb196; letter-spacing: 0; }
  #invgrid { display: grid; grid-template-columns: repeat(5, 62px); gap: 6px; align-content: start; overflow-y: auto; }
  .cell { height: 62px; background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 8px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
  .cell:hover { border-color: var(--acc); }
  .cell .i { font-size: 24px; } .cell .n { font-size: 9px; color: #cfdac8; margin-top: 2px; white-space: nowrap; overflow: hidden; max-width: 58px; text-overflow: ellipsis; }
  .cell .q { position: absolute; top: 2px; right: 5px; font-size: 11px; font-weight: 700; color: var(--acc); }
  #equip { margin-top: 10px; font-size: 12px; color: #c7d3bf; line-height: 1.6; }
  #craftlist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .rec { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border: 1px solid var(--edge); border-radius: 9px; margin-bottom: 6px; background: rgba(255,255,255,.03); }
  .rec.lock { opacity: .4; }
  .rec .i { font-size: 24px; width: 32px; text-align: center; }
  .rec .body { flex: 1; min-width: 0; } .rec .nm { font-weight: 700; font-size: 13px; } .rec .ds { font-size: 11px; color: #9fb196; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin: 2px 3px 0 0; background: rgba(255,255,255,.07); }
  .chip.no { color: var(--bad); } .chip.ok { color: var(--good); }
  .btn { background: linear-gradient(#3f6a37, #23401f); border: 1px solid #5f8f55; color: var(--ink); border-radius: 7px; padding: 6px 12px;
    cursor: pointer; font: 700 12px Inter; }
  .btn:hover { filter: brightness(1.2); } .btn:disabled { opacity: .35; cursor: not-allowed; filter: none; }
  #bigmap { position: fixed; z-index: 12; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  #bigmap canvas { width: min(84vh, 92vw); height: min(84vh, 92vw); border: 2px solid var(--edge); border-radius: 12px; }

  #overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(5,20,15,.35), rgba(0,0,0,.85)); }
  #overlay .box { text-align: center; max-width: 780px; padding: 24px; }
  #overlay h1 { font: clamp(64px, 12vw, 140px) 'Bebas Neue'; margin: 0; letter-spacing: 6px; line-height: .9;
    background: linear-gradient(#fff6d0, #f2b33d 50%, #b85c1a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 20px rgba(242,120,40,.45)); }
  #overlay .sub { font: 600 14px Inter; color: #cfe0c2; letter-spacing: 5px; text-transform: uppercase; margin: 8px 0 26px; }
  #overlay p { color: #d6e2cc; line-height: 1.6; }
  #overlay .big { font: 26px 'Bebas Neue'; letter-spacing: 2px; padding: 10px 40px; margin: 6px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(#f2b33d, #b0641a); border: 1px solid #ffe2a0; color: #23140a; }
  #overlay .big.alt { background: linear-gradient(#3f6a37, #23401f); border-color: #7fb070; color: var(--ink); }
  #overlay .big:hover { filter: brightness(1.12); }
  #overlay .keys { font-size: 12px; color: #b4c4aa; margin-top: 22px; line-height: 1.9; }
  kbd { background: #1d2b1c; border: 1px solid var(--edge); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #eef3e6; }
  @media (max-width: 760px) { #log { width: 60vw; } #goal, #tames { display: none; } .slot { width: 44px; height: 48px; } .slot .n { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hurt"></div>

<div id="hud" class="hide">
  <div id="log" class="hud"></div>

    <div class="bar"><i id="b-hp" style="background:var(--hp)"></i><span id="t-hp">Health</span></div>

  </div>
  <div id="prompt" class="hud"></div>
  <div id="mountbar" class="hud hide"></div>
  <div id="hotbar" class="hud"></div>

    <div id="clock"><span id="clk">Day 1</span><small id="biome">Beach</small></div>

  </div>
  <div id="boss" class="hud hide"><div class="nm">☠ Alpha Rex ☠</div><div class="bar"><i id="b-boss" style="background:linear-gradient(90deg,#ff3b1a,#ffb03a)"></i></div></div>
</div>

<div id="inv" class="panel hide">
  <div class="col" style="width:350px">
    <h3>Inventory <small>click food to eat · click structures to place</small></h3>
    <div id="invgrid"></div>
    <div id="equip"></div>
  </div>
  <div class="col" style="flex:1">
    <h3>Engrams <small>Shift-click Craft for ×5 · Tab to close</small></h3>
    <div id="craftlist"></div>
  </div>
</div>
<div id="bigmap" class="hide"><canvas id="bmc" width="704" height="704"></canvas></div>
<div id="overlay"><div class="box"><h1>Primal Shores</h1><div class="sub">Generating island…</div></div></div>

<script>
'use strict';
// =====================================================================
//  PRIMAL SHORES: a dino survival game in a single file
// =====================================================================
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const lc = document.createElement('canvas'), lctx = lc.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = lc.width = Math.round(VW * DPR); cv.height = lc.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
}
addEventListener('resize', resize); resize();

const TILE = 32, MW = 176, MH = 176, S = 4, WPX = MW * TILE, HPX = MH * TILE;
const DAY = 420; // seconds per in-game day
const T = { DEEP: 0, SHAL: 1, SAND: 2, GRASS: 3, FOREST: 4, ROCK: 5, SNOW: 6, ASH: 7, LAVA: 8 };
const BIOME = ['Ocean', 'Shallows', 'Beach', 'Grasslands', 'Jungle', 'Highlands', 'Snow Peaks', 'Ash Fields', 'Lava'];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function wpick(tab) { let s = 0; for (const e of tab) s += e[1]; let r = Math.random() * s; for (const e of tab) { r -= e[1]; if (r <= 0) return e[0]; } return tab[0][0]; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function Noise(seed) {
  const r = mulberry32(seed), perm = new Uint16Array(512), val = new Float32Array(256);
  for (let i = 0; i < 256; i++) { perm[i] = i; val[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const sm = t => t * t * (3 - 2 * t);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = val[perm[perm[X] + Y]], b = val[perm[perm[X + 1] + Y]], c = val[perm[perm[X] + Y + 1]], d = val[perm[perm[X + 1] + Y + 1]];
    const u = sm(xf), v = sm(yf); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  return (x, y, oct = 5) => { let t = 0, amp = 1, f = 1, nm = 0; for (let o = 0; o < oct; o++) { t += n2(x * f + o * 31.7, y * f + o * 17.3) * amp; nm += amp; amp *= .5; f *= 2; } return t / nm; };
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; } else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

// ---------------------------------------------------------------- data
const ITEMS = {
  wood: ['Wood', '🪵'], thatch: ['Thatch', '🌾'], fiber: ['Fiber', '🧶'], stone: ['Stone', '🪨'], flint: ['Flint', '🔹'],
  metal: ['Metal Ore', '🌑'], ingot: ['Metal Ingot', '🔩'], berries: ['Mejoberries', '🫐'], narco: ['Narcoberries', '🍇'],
  meat: ['Raw Meat', '🥩'], cooked: ['Cooked Meat', '🍖'], hide: ['Hide', '🐾'], arrow: ['Stone Arrow', '➶'], tranq: ['Tranq Arrow', '💉'],
  pick: ['Stone Pick', '⛏️'], hatchet: ['Stone Hatchet', '🪓'], club: ['Wooden Club', '🏏'], spear: ['Spear', '🔱'], bow: ['Bow', '🏹'],
  mpick: ['Metal Pick', '⚒️'], mhatchet: ['Metal Hatchet', '🪓'], sword: ['Metal Sword', '🗡️'],
  hidearmor: ['Hide Armor', '🦺'], marmor: ['Metal Armor', '🛡️'],
  campfire: ['Campfire', '🔥'], bed: ['Sleeping Bag', '🛏️'], floor: ['Wood Floor', '🟫'], wall: ['Wood Wall', '🧱'], door: ['Wood Door', '🚪'],
  forge: ['Forge', '⚗️'], stonewall: ['Stone Wall', '🗿'], mwall: ['Metal Wall', '⬜'],
};
const H = (o) => Object.assign({ wood: 0, thatch: 0, stone: 0, flint: 0, metal: 0, berries: 1, fiber: .5, narco: .5, meat: 1, hide: .5 }, o);
const TOOLS = {
  fists:    { dmg: 6,  torp: 6,  cd: .45, reach: 44, harv: H({ wood: 1, thatch: 1, stone: .4, flint: .4, berries: 3, fiber: 2, narco: 1.2, meat: 1, hide: .6 }) },
  pick:     { dmg: 12, cd: .6, reach: 54, harv: H({ wood: .5, thatch: 3.2, stone: 3, flint: 1, metal: 1, meat: 3, hide: .7 }) },

  bow:      { ranged: 1, cd: .75 },

  mhatchet: { dmg: 24, cd: .55, reach: 56, harv: H({ wood: 7, thatch: 2, stone: 2, flint: 6, metal: 1, meat: 3, hide: 5 }) },
  sword:    { dmg: 48, cd: .55, reach: 72, harv: H({ meat: 2, hide: 1 }) },

const TOOL_ORDER = ['pick', 'hatchet', 'club', 'spear', 'bow', 'mpick', 'mhatchet', 'sword'];
const ARMOR = { hidearmor: .25, marmor: .5 };
const SD = { // structures. block: 0 none, 1 wild creatures only, 2 everything
  floor:     { hp: 300,  block: 0 }, campfire: { hp: 250, block: 0, light: 330 }, bed: { hp: 300, block: 0 },
  wall:      { hp: 900,  block: 2 }, door: { hp: 700, block: 1 }, forge: { hp: 1600, block: 2, light: 170 },
  stonewall: { hp: 2600, block: 2 }, mwall: { hp: 8000, block: 2 },
};
const STRUCT_ORDER = ['floor', 'wall', 'door', 'campfire', 'bed', 'forge', 'stonewall', 'mwall'];
const RECIPES = [
  { id: 'pick',      lvl: 1,  cost: { wood: 1, stone: 1, thatch: 10 }, ds: 'Best for Stone, Thatch and Metal' },
  { id: 'cooked',    lvl: 1,  cost: { meat: 1 }, st: 'campfire', ds: 'Restores far more food than raw meat' },
  { id: 'hatchet',   lvl: 2,  cost: { wood: 1, flint: 1, stone: 1 }, ds: 'Best for Wood, Flint and Hide' },
  { id: 'campfire',  lvl: 2,  cost: { thatch: 12, flint: 2, stone: 12, wood: 2 }, ds: 'Light, warmth and cooking' },
  { id: 'club',      lvl: 3,  cost: { wood: 4, fiber: 15 }, ds: 'Knocks creatures out (torpor) for taming' },
  { id: 'spear',     lvl: 3,  cost: { wood: 8, flint: 2, fiber: 12 }, ds: 'Long reach, solid damage' },
  { id: 'bed',       lvl: 4,  cost: { fiber: 25, hide: 12, thatch: 10 }, ds: 'You respawn here after death' },
  { id: 'floor',     lvl: 4,  cost: { wood: 6, thatch: 4 }, ds: 'Decorative base flooring' },
  { id: 'wall',      lvl: 5,  cost: { wood: 20, thatch: 6 }, ds: 'Blocks everything' },
  { id: 'door',      lvl: 5,  cost: { wood: 15, fiber: 8 }, ds: 'You and your tames pass, wild dinos don\'t' },
  { id: 'bow',       lvl: 6,  cost: { wood: 6, fiber: 20, hide: 10 }, ds: 'Ranged. T switches arrow type' },
  { id: 'arrow',     lvl: 6,  cost: { thatch: 2, flint: 1, fiber: 2 }, out: 3, ds: '×3 arrows' },
  { id: 'tranq',     lvl: 7,  cost: { arrow: 1, narco: 3 }, ds: 'Heavy torpor, the taming workhorse' },

  { id: 'mpick',     lvl: 12, cost: { ingot: 10, wood: 2, hide: 10 }, ds: 'Huge Stone and Metal yields' },
  { id: 'mhatchet',  lvl: 12, cost: { ingot: 8, wood: 2, hide: 10 }, ds: 'Huge Wood and Hide yields' },
  { id: 'sword',     lvl: 15, cost: { ingot: 16, hide: 10 }, ds: 'Heavy melee damage' },
  { id: 'marmor',    lvl: 16, cost: { ingot: 40, hide: 20 }, ds: '−50% damage taken' },
  { id: 'mwall',     lvl: 18, cost: { ingot: 20, stone: 20 }, ds: 'Nearly unbreakable' },
];
const UNIQUE = new Set([...TOOL_ORDER, 'hidearmor', 'marmor']);
const NODE = {
  tree:  { res: ['wood', 'thatch'], hp: 14, cr: 9 },
  rock:  { res: ['stone', 'flint'], hp: 12, cr: 13 },
  metal: { res: ['metal', 'stone'], hp: 14, cr: 14 },
  bush:  { res: ['berries', 'fiber', 'narco'], hp: 5, cr: 0 },
};
const SP = {

  if (G.title) return;
  hudT -= dt; miniT -= dt;
  if (hotDirty) { renderHotbar(); hotDirty = false; }
  if (invDirty && !$('inv').classList.contains('hide')) renderInv();
  if (logDirty) { $('log').innerHTML = G.msgs.filter(m => G.t - m.t < 14).map(m => `<div class="${m.cls}">${m.text}</div>`).join(''); logDirty = false; }
  if (hudT > 0) return; hudT = .1;
  if (G.msgs.length && G.msgs.some(m => G.t - m.t >= 14 && G.t - m.t < 14.2)) logDirty = true;
  setBar('hp', P.hp, P.mhp, '❤ Health'); setBar('st', P.st, P.mst, '⚡ Stamina'); setBar('fd', P.food, 100, '🍖 Food'); setBar('wt', P.water, 100, '💧 Water');
  $('b-xp').style.width = (P.xp / xpNeed(P.lvl) * 100) + '%'; $('t-xp').textContent = `XP ${Math.floor(P.xp)} / ${xpNeed(P.lvl)}`;
  $('lvltxt').textContent = `Level ${P.lvl}`; $('armortxt').textContent = armorRed() ? `Armor −${armorRed() * 100}%` : '';
  const h = (G.time * 24 + 6) % 24; $('clk').textContent = `Day ${G.day} · ${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor(h % 1 * 60)).padStart(2, '0')} ${darkness() > .4 ? '🌙' : '☀'}`;
  $('biome').textContent = BIOME[tileAt(P.x, P.y)];
  $('hurt').style.opacity = P.hurt > 0 ? Math.min(.8, P.hurt * 2) : (P.hp / P.mhp < .25 && !P.dead ? .35 : 0);
  const g = GOALS.find(g => !g[1]()); $('goaltxt').textContent = g ? g[0] : 'All objectives complete. You rule Primal Shores!';
  // prompt
  const pr = [];
  if (!P.dead) {
    if (G.build) pr.push(`<b>Click</b> place ${ITEMS[G.build][0]} (${P.inv[G.build] || 0}) · <b>Right-click</b> cancel`);
    const ko = koNear();
    if (ko) { const [f, n] = FOOD[ko.d.diet]; pr.push(`<b>E</b> Feed ${ko.d.n} ${ITEMS[f][1]}×${n} (have ${P.inv[f] || 0}${ko.d.diet === 'c' ? ', 🍖 ' + (P.inv.cooked || 0) : ''}) · taming ${Math.round(ko.prog * 100)}% · torpor ${Math.round(ko.torp / ko.mtorp * 100)}%`); }
    if (P.mount) pr.push(`<b>R</b> dismount · <b>Click</b> attack/harvest`);
    else { for (const c of G.cr) if (c.tame && c.d.ride && dist(c, P) < c.d.sz + 60) { pr.push(`<b>R</b> ride ${c.d.n}`); break; } }
    if (!ko && nearWater() && P.water < 95) pr.push(`<b>Hold E</b> drink`);
    if (P.tool === 'bow' && !G.build && !P.mount) pr.push(`<b>T</b> arrows: ${P.ammo === 'tranq' ? '💉 Tranq' : '➶ Stone'}`);
    const mw = mouseWorld(), st = W.sgrid[Math.floor(mw.y / TILE) * MW + Math.floor(mw.x / TILE)];
    if (st && !G.build && Math.hypot(st.tx * TILE + 16 - P.x, st.ty * TILE + 16 - P.y) < 240) pr.push(`<b>X</b> pick up ${ITEMS[st.type][0]}`);
  }
  $('prompt').innerHTML = pr.map(p => `<div>${p}</div>`).join('<br>');
  // mount
  const mb = $('mountbar');
  if (P.mount) { mb.classList.remove('hide'); mb.innerHTML = `<b style="color:var(--acc)">${cname(P.mount)}</b> · ${Math.ceil(P.mount.hp)} / ${Math.round(P.mount.mhp)} HP · ${Math.round(P.mount.dmg)} dmg<div class="bar" style="height:6px"><i style="width:${P.mount.hp / P.mount.mhp * 100}%;background:#5fd35a"></i></div>`; }
  else mb.classList.add('hide');
  // tames
  const ts = G.cr.filter(c => c.tame).sort((a, b) => b.lvl - a.lvl).slice(0, 6);
  $('tames').innerHTML = ts.map(c => `<div class="t">${c === P.mount ? '🐎 ' : c.follow ? '' : '⏸ '}${cname(c)}<div class="bar"><i style="width:${c.hp / c.mhp * 100}%;background:#5fd35a"></i></div></div>`).join('');
  // boss
  const a = G.alpha, showBoss = a && !a.dead && dist(a, P) < 1100;
  $('boss').classList.toggle('hide', !showBoss); if (showBoss) $('b-boss').style.width = (a.hp / a.mhp * 100) + '%';
  if (miniT <= 0) { miniT = .25; drawMap($('mini'), 190, true); if (!$('bigmap').classList.contains('hide')) drawMap($('bmc'), 704, false); }
}
function drawMap(c, sz, local) {
  const m = c.getContext('2d'), k = sz / MW;
  m.imageSmoothingEnabled = true; m.clearRect(0, 0, sz, sz); m.drawImage(W.mini, 0, 0, sz, sz);
  m.fillStyle = 'rgba(255,80,30,.9)'; m.font = `${Math.round(sz / 14)}px serif`; m.textAlign = 'center'; m.textBaseline = 'middle';
  if (!G.alphaDead) m.fillText('☠', W.vx / TILE * k, W.vy / TILE * k);
  for (const s of W.structs) { m.fillStyle = s.type === 'bed' ? '#fff' : '#d9a441'; m.fillRect(s.tx * k - 1, s.ty * k - 1, Math.max(2, k), Math.max(2, k)); }
  for (const b of G.bags) m.fillText('🎒', b.x / TILE * k, b.y / TILE * k);
  for (const cr of G.cr) if (cr.tame) { m.fillStyle = '#7fd36b'; m.beginPath(); m.arc(cr.x / TILE * k, cr.y / TILE * k, Math.max(2, sz / 120), 0, 6.28); m.fill(); }
  if (!P.dead) {
    const px = P.x / TILE * k, py = P.y / TILE * k; m.save(); m.translate(px, py); m.rotate(P.a);
    m.fillStyle = '#fff'; m.strokeStyle = '#000'; m.lineWidth = 1.5; m.beginPath(); m.moveTo(sz / 40, 0); m.lineTo(-sz / 70, sz / 90); m.lineTo(-sz / 70, -sz / 90); m.closePath(); m.stroke(); m.fill(); m.restore();
  }
}

// ---------------------------------------------------------------- overlays
function showOverlay(html) { const o = $('overlay'); o.innerHTML = `<div class="box">${html}</div>`; o.classList.remove('hide'); return o; }
function hideOverlay() { $('overlay').classList.add('hide'); }
function showTitle() {
  const s = loadSave();
  const o = showOverlay(`<h1>Primal Shores</h1><div class="sub">Survive · Tame · Conquer</div>
    <p>You wash up on a wild island ruled by dinosaurs. Punch trees, craft tools, build a base,<br>knock out dinos and tame them, then ride your army up the volcano and slay the <b style="color:#ff8a5a">Alpha Rex</b>.</p>
    <div><button class="big" id="b-new">New Island</button>${s ? `<button class="big alt" id="b-cont">Continue · Day ${s.day} · Lv ${s.p.lvl}</button>` : ''}</div>
    <div class="keys"><kbd>WASD</kbd> move · <kbd>Shift</kbd> sprint · <kbd>Hold click</kbd> attack/harvest · <kbd>Tab</kbd> inventory &amp; crafting · <kbd>1-0</kbd> hotbar<br>
    <kbd>E</kbd> feed knocked-out dino / hold to drink · <kbd>Q</kbd> eat · <kbd>R</kbd> ride · <kbd>F</kbd> whistle follow/stay · <kbd>T</kbd> arrow type<br>
    <kbd>X</kbd> pick up structure · <kbd>M</kbd> map · <kbd>Wheel</kbd> zoom · <kbd>P</kbd> pause</div>
    <p style="font-size:12px;color:#8fa088;margin-top:16px">Taming: hit a creature with a <b>Club</b> or <b>Tranq Arrows</b> until its purple torpor bar fills, then feed it.<br>Herbivores eat Mejoberries, carnivores eat meat. Keep it asleep and protect it while it eats.</p>`);
  o.querySelector('#b-new').onclick = () => { audio(); if (s && !confirm('Start a new island? Your saved game will be overwritten when the new one autosaves.')) return; newGame(); };
  if (s) o.querySelector('#b-cont').onclick = () => { audio(); continueGame(); };
}
function showDeath() {
  const beds = W.structs.filter(s => s.type === 'bed');
  const o = showOverlay(`<h1 style="font-size:96px">You Died</h1><div class="sub">Day ${G.day} · Level ${P.lvl}</div>
    <p>Your resources were dropped where you fell (🎒 on the map). Tools and armor are kept.</p>
    <div>${beds.map((b, i) => `<button class="big" data-b="${i}">Respawn at Sleeping Bag ${beds.length > 1 ? i + 1 : ''}</button>`).join('')}<button class="big alt" id="b-beach">Random Beach</button></div>`);
  o.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { const s = beds[+b.dataset.b]; respawn({ x: s.tx * TILE + 16, y: s.ty * TILE + 16 }); });
  o.querySelector('#b-beach').onclick = () => respawn(null);
}
function victory() {
  save();
  const o = showOverlay(`<h1>The Alpha Has Fallen</h1><div class="sub">Primal Shores is yours</div>
    <p>Day ${G.day} · Level ${P.lvl} · ${G.stats.tamed} tames · ${G.stats.kills} kills · ${G.stats.deaths} deaths</p>
    <div><button class="big" id="b-keep">Keep Playing</button><button class="big alt" id="b-newi">New Island</button></div>`);
  o.querySelector('#b-keep').onclick = hideOverlay;
  o.querySelector('#b-newi').onclick = () => { startWorld((Math.random() * 1e9) | 0, true); newGame(); };
}

// ---------------------------------------------------------------- input
const K = {}; let MX = innerWidth / 2, MY = innerHeight / 2, mouseDown = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'tab') e.preventDefault();
  if (!G || G.title || !$('overlay').classList.contains('hide')) return;
  if (e.repeat && k !== 'e') { K[k] = true; return; }
  K[k] = true;
  if (k === 'tab' || k === 'i') { toggleInv(); return; }
  if (k === 'escape') { if (G.build) { G.build = null; hotDirty = true; } toggleInv(false); $('bigmap').classList.add('hide'); return; }
  if (k === 'm') { $('bigmap').classList.toggle('hide'); miniT = 0; return; }
  if (k === 'p') { G.paused = !G.paused; msg(G.paused ? '⏸ Paused (P to resume)' : '▶ Resumed'); return; }
  if (P.dead) return;
  if (/^[0-9]$/.test(k)) { const s = hotbarSlots(); selectSlot(s[k === '0' ? 9 : +k - 1]); return; }
  if (k === 'e' && !e.repeat) interact();
  if (k === 'q') eatBest();
  if (k === 'r') toggleRide();
  if (k === 'f') whistle();
  if (k === 't') { P.ammo = P.ammo === 'arrow' ? 'tranq' : 'arrow'; msg(`Arrows: ${P.ammo === 'tranq' ? '💉 Tranq' : '➶ Stone'}`); hotDirty = true; }
  if (k === 'x') demolish();
});
addEventListener('keyup', e => { K[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in K) K[k] = false; mouseDown = false; });
cv.addEventListener('mousemove', e => { MX = e.clientX; MY = e.clientY; });
cv.addEventListener('mousedown', e => {
  MX = e.clientX; MY = e.clientY; audio();
  if (!G || G.title || P.dead) return;
  if (e.button === 2) { if (G.build) { G.build = null; hotDirty = true; } return; }
  if (e.button !== 0) return;
  if (G.build) { place(); return; }
  mouseDown = true;
});
addEventListener('mouseup', () => { mouseDown = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (!G || G.title) return; e.preventDefault(); G.cam.z = clamp(G.cam.z * (e.deltaY > 0 ? .9 : 1.1), .45, 1.8); }, { passive: false });
$('mini').onclick = () => { $('bigmap').classList.remove('hide'); miniT = 0; };
$('bigmap').onclick = () => $('bigmap').classList.add('hide');
addEventListener('beforeunload', save);

// ---------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && !G.paused) update(dt);
  render(); if (G) updateHUD(dt);
  requestAnimationFrame(frame);
}
setTimeout(() => {
  startWorld((Math.random() * 1e9) | 0, true);
  showTitle();
  requestAnimationFrame(frame);
}, 30);
</script>
</body>
</html>
