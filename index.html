<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandfire Crusade</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e8c46a; --gold-dim: #a8873d; --ink: #f3e9d2; --panel: #1b1510; --panel2: #2a2018;
    --edge: #5a4326; --bad: #e05a4a; --good: #7bc96f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a07; color: var(--ink);
    font-family: Inter, system-ui, sans-serif; user-select: none; }
  canvas#c { position: fixed; inset: 0; display: block; cursor: default; }
  .hud { position: fixed; z-index: 5; }
  #top { top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: linear-gradient(#2a2018, #17110c); border-bottom: 2px solid var(--edge); font-size: 14px; }
  #top .res { display: flex; align-items: center; gap: 6px; min-width: 70px; }
  #top .res b { color: var(--gold); font-weight: 600; }
  #top .ico { font-size: 16px; }
  #top .sp { flex: 1; }
  .btn { background: linear-gradient(#4a3722, #2c2015); border: 1px solid var(--edge); color: var(--ink);
    border-radius: 5px; padding: 4px 9px; cursor: pointer; font: 600 12px Inter, sans-serif; }
  .btn:hover { border-color: var(--gold); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  #panel { left: 0; right: 0; bottom: 0; height: 150px; display: flex; gap: 10px; padding: 10px;
    background: linear-gradient(#2a2018, #120d09); border-top: 2px solid var(--edge); }
  .grp { display: flex; flex-direction: column; gap: 6px; }
  .grp h4 { margin: 0; font: 700 11px Cinzel, serif; letter-spacing: 1px; color: var(--gold-dim); text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(5, 74px); gap: 5px; }
  .card { height: 50px; background: linear-gradient(#3b2c1c, #241a11); border: 1px solid var(--edge); border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--gold); }
  .card.sel { border-color: var(--gold); box-shadow: 0 0 8px rgba(232,196,106,.5); }
  .card.na { opacity: .45; }
  .card .i { font-size: 19px; line-height: 1; }
  .card .n { font-size: 10px; margin-top: 3px; }
  .card .q { position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--gold); }
  #info { flex: 1; min-width: 180px; background: rgba(0,0,0,.25); border: 1px solid var(--edge); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; line-height: 1.45; overflow: hidden; }
  #info .t { font: 700 14px Cinzel, serif; color: var(--gold); }
  #mini { width: 130px; height: 130px; border: 2px solid var(--edge); border-radius: 4px; cursor: pointer; image-rendering: pixelated; }
  #log { position: fixed; z-index: 4; left: 14px; top: 56px; width: 420px; pointer-events: none; font-size: 13px; }
  #log div { background: rgba(15,10,6,.75); border-left: 3px solid var(--gold); padding: 5px 9px; margin-bottom: 4px;
    border-radius: 0 4px 4px 0; transition: opacity 1s; }
  #log div.war { border-left-color: var(--bad); }
  #log div.ok { border-left-color: var(--good); }
  #lords { position: fixed; z-index: 4; right: 14px; top: 56px; width: 220px; font-size: 12px; pointer-events: none; }
  #lords .l { display: flex; align-items: center; gap: 8px; background: rgba(15,10,6,.75); padding: 5px 8px; border-radius: 4px; margin-bottom: 4px; }
  #lords .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  #lords .dead { opacity: .4; text-decoration: line-through; }
  #lords .bar { height: 4px; background: #333; border-radius: 2px; margin-top: 3px; }
  #lords .bar i { display: block; height: 100%; border-radius: 2px; }
  #tip { position: fixed; z-index: 9; pointer-events: none; background: #120d09; border: 1px solid var(--gold-dim);
    padding: 6px 9px; border-radius: 5px; font-size: 12px; max-width: 240px; display: none; }
  /* Title / end screens */
  #overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(40,25,10,.55), rgba(0,0,0,.92)); }
  #overlay .box { text-align: center; max-width: 760px; padding: 24px; }
  #overlay h1 { font: 900 clamp(40px, 8vw, 84px) Cinzel, serif; margin: 0; letter-spacing: 3px;
    background: linear-gradient(#fff3c4, #e8c46a 45%, #9c6a1e); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 14px rgba(232,140,40,.45)); }
  #overlay .sub { font: 500 18px Cinzel, serif; color: #d9b98a; letter-spacing: 4px; margin: 6px 0 22px; }
  #overlay p { color: #d8ccb4; line-height: 1.6; }
  #overlay .lordsel { display: flex; gap: 12px; justify-content: center; margin: 18px 0; flex-wrap: wrap; }
  #overlay .lc { width: 170px; background: rgba(20,14,9,.85); border: 1px solid var(--edge); border-radius: 8px; padding: 10px; font-size: 12px; text-align: left; }
  #overlay .lc b { font: 700 13px Cinzel, serif; }
  #overlay .big { font: 700 20px Cinzel, serif; padding: 12px 34px; margin: 6px; border-radius: 8px;
    background: linear-gradient(#b8862f, #6e4a14); border: 1px solid #f0d58e; color: #fff8e4; cursor: pointer; }
  #overlay .big:hover { filter: brightness(1.15); }
  #overlay .diff { margin: 10px 0 4px; }
  #overlay .keys { font-size: 12px; color: #b9a98a; margin-top: 18px; line-height: 1.7; }
  kbd { background: #2c2015; border: 1px solid var(--edge); border-radius: 3px; padding: 0 5px; font-size: 11px; }
  #banner { position: fixed; z-index: 15; left: 50%; top: 32%; transform: translate(-50%, -50%); pointer-events: none;
    font: 900 46px Cinzel, serif; color: #ffe7a8; text-shadow: 0 3px 18px #000, 0 0 30px rgba(220,80,40,.6); opacity: 0;
    transition: opacity .6s; text-align: center; white-space: nowrap; }
  #banner small { display: block; font: 600 18px Cinzel, serif; color: #f1d6a0; }
</style>

<body>
<canvas id="c"></canvas>

<div id="top" class="hud">
  <div class="res"><span class="ico">🪵</span><b id="r-wood">0</b></div>
  <div class="res"><span class="ico">🪨</span><b id="r-stone">0</b></div>
  <div class="res"><span class="ico">🌾</span><b id="r-food">0</b></div>
  <div class="res"><span class="ico">🪙</span><b id="r-gold">0</b></div>
  <div class="res" title="Idle peasants / population / housing"><span class="ico">👥</span><b id="r-pop">0</b></div>
  <div class="res" title="Popularity: above 50 attracts peasants, below 35 drives them away"><span class="ico">❤️</span><b id="r-popl">0</b></div>
  <div class="res" title="Tax level: more gold, less popularity">
    <span class="ico">⚖️</span>
    <button class="btn" id="tax-dn">−</button><b id="r-tax" style="min-width:42px;text-align:center">Fair</b><button class="btn" id="tax-up">+</button>
  </div>
  <div class="res"><span class="ico">⚔️</span><b id="r-army">0</b></div>
  <div class="sp"></div>
  <div class="res"><span class="ico">⏳</span><b id="r-time">0:00</b></div>
  <button class="btn" id="spd">Speed 1×</button>
  <button class="btn" id="mute">🔊</button>
  <button class="btn" id="pause">Pause</button>
</div>

<div id="log"></div>
<div id="lords" class="hud"></div>
<div id="banner"></div>
<div id="tip"></div>

<div id="panel" class="hud">
  <div class="grp"><h4>Build</h4><div class="cards" id="build"></div></div>
  <div class="grp"><h4>Barracks</h4><div class="cards" id="train" style="grid-template-columns:repeat(3,74px)"></div></div>
  <div id="info"></div>
  <canvas id="mini" width="130" height="130"></canvas>
</div>

<div id="overlay"></div>

<script>
'use strict';
// =====================================================================
//  SANDFIRE CRUSADE — a castle-siege RTS in a single file
// =====================================================================
const TS = 32, MW = 112, MH = 112, N = MW * MH;
const G = 0, S = 1, W = 2, F = 3, R = 4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let VW = 0, VH = 0;
function resize() { VW = cv.width = innerWidth; VH = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------------------------------------------------------------- data
const BDEF = {
  keep:       { n: 'Keep', w: 3, h: 3, hp: 3000, house: 12, cost: {}, icon: '🏰', shoot: { range: 7, dmg: 7, cd: 1.6 }, desc: 'Your seat of power. If it falls, you lose.' },
  hovel:      { n: 'Hovel', w: 2, h: 2, hp: 250, house: 8, cost: { wood: 20 }, icon: '🛖', desc: 'Houses 8 peasants.' },
  woodcutter: { n: 'Woodcutter', w: 2, h: 2, hp: 250, cost: { wood: 15 }, icon: '🪓', work: 1, prod: 'wood', amt: 5, period: 7, need: F, needR: 5, desc: 'Produces wood. Must be near a forest.' },
  quarry:     { n: 'Quarry', w: 2, h: 2, hp: 300, cost: { wood: 20 }, icon: '⛏️', work: 2, prod: 'stone', amt: 6, period: 8, need: R, needR: 4, desc: 'Produces stone. Must be near rocks.' },
  farm:       { n: 'Wheat Farm', w: 3, h: 3, hp: 200, cost: { wood: 20 }, icon: '🌾', work: 1, prod: 'food', amt: 6, period: 7, desc: 'Produces food for your people.' },
  chapel:     { n: 'Chapel', w: 2, h: 2, hp: 400, cost: { wood: 20, stone: 20, gold: 60 }, icon: '⛪', desc: '+7 popularity (up to 3 chapels).' },
  barracks:   { n: 'Barracks', w: 3, h: 3, hp: 800, cost: { wood: 40, stone: 20 }, icon: '⚔️', desc: 'Trains soldiers from idle peasants.' },
  wall:       { n: 'Stone Wall', w: 1, h: 1, hp: 450, cost: { stone: 2 }, icon: '🧱', desc: 'Drag to build a wall line. Blocks all units.' },
  gate:       { n: 'Gatehouse', w: 1, h: 1, hp: 700, cost: { stone: 10 }, icon: '🚪', gate: true, desc: 'Your troops pass, enemies must break it.' },
  tower:      { n: 'Tower', w: 2, h: 2, hp: 1000, cost: { stone: 25 }, icon: '🗼', shoot: { range: 8, dmg: 9, cd: 1.2 }, desc: 'Archer tower. Shoots enemies in range.' },
};
const BUILD_ORDER = ['hovel', 'farm', 'woodcutter', 'quarry', 'chapel', 'barracks', 'wall', 'gate', 'tower'];
const UDEF = {
  spear:    { n: 'Spearman', icon: '🔱', hp: 60,  dmg: 8,  range: 1.1, spd: 2.5, cd: 1.0, cost: { gold: 8, wood: 5 }, r: .28, bm: .6, t: 3, desc: 'Cheap, fast infantry.' },
  archer:   { n: 'Archer',   icon: '🏹', hp: 45,  dmg: 7,  range: 6.5, spd: 2.3, cd: 1.5, cost: { gold: 12, wood: 10 }, r: .26, bm: .15, t: 3.5, ranged: true, desc: 'Ranged. Fragile up close.' },
  sword:    { n: 'Swordsman',icon: '🗡️', hp: 160, dmg: 16, range: 1.1, spd: 1.5, cd: 1.2, cost: { gold: 25, stone: 10 }, r: .32, bm: 1.0, t: 5, desc: 'Heavy armour, great vs walls.' },
  knight:   { n: 'Knight',   icon: '🐎', hp: 200, dmg: 19, range: 1.2, spd: 3.6, cd: 1.1, cost: { gold: 45, food: 15 }, r: .38, bm: .6, t: 6, desc: 'Fast mounted shock troops.' },
  catapult: { n: 'Catapult', icon: '☄️', hp: 170, dmg: 26, range: 9.5, spd: 1.0, cd: 4.5, cost: { gold: 60, wood: 40 }, r: .45, bm: 4.0, t: 9, ranged: true, siege: true, desc: 'Siege engine. Smashes walls.' },
  maceman:  { n: 'Maceman',  icon: '🔨', hp: 110, dmg: 14, range: 1.1, spd: 2.7, cd: 1.0, cost: { gold: 18, stone: 5 }, r: .3, bm: .8, t: 4, desc: 'Fast, hard-hitting brawler.' },
};
const TRAIN_ORDER = ['spear', 'archer', 'maceman', 'sword', 'knight', 'catapult'];
const TAX_NAMES = ['None', 'Low', 'Fair', 'High', 'Cruel'];
const TAX_RATE = [0, .03, .06, .1, .15];
const TAX_POP = [20, 8, 0, -12, -26];
const DIFF = [ // easy, normal, hard
  { name: 'Squire', prod: 0.9, gold: 0.3, first: 1.4, size: 0.8 },
  { name: 'Knight', prod: 1.2, gold: 1.0, first: 1.0, size: 1.0 },
  { name: 'Warlord', prod: 1.5, gold: 2.0, first: 0.75, size: 1.3 },
];
const LORDS = [
  { name: 'You', title: 'Lord of the Valley', color: '#3b82f6', dark: '#1d3f8a', ai: false },
  { name: 'Varric the Iron', title: 'The Relentless', color: '#dc2626', dark: '#7f1d1d', ai: true, first: 210, size: 10, hate: 2.5,
    mix: { spear: 3, maceman: 3, sword: 3, archer: 2, catapult: 1 }, taunt: 'Your walls will crumble like stale bread!',
    blurb: 'Aggressive. Attacks early and often with heavy infantry.' },
  { name: 'Sultana Zahra', title: 'The Desert Wind', color: '#16a34a', dark: '#14532d', ai: true, first: 260, size: 12, hate: 1.4,
    mix: { knight: 3, archer: 3, spear: 2, catapult: 1 }, taunt: 'My riders will be at your gates before the dust settles.',
    blurb: 'Swift cavalry raids and massed archers.' },
  { name: 'Baron Mordel', title: 'The Patient', color: '#a855f7', dark: '#581c87', ai: true, first: 360, size: 16, hate: 1.0,
    mix: { archer: 4, sword: 2, spear: 2, catapult: 2 }, taunt: 'I have stone, and I have time. You have neither.',
    blurb: 'Turtle. Builds heavy walls, then rolls in with siege.' },
  { name: 'Ser Halbrecht', title: 'The Opportunist', color: '#eab308', dark: '#713f12', ai: true, first: 300, size: 12, hate: 0.8,
    mix: { maceman: 3, archer: 2, knight: 1, spear: 2, catapult: 1 }, taunt: 'Fight on, all of you. I will take what is left.',
    blurb: 'Preys on whichever lord is weakest.' },
];
const SITES = [{ x: 18, y: 93 }, { x: 93, y: 18 }, { x: 93, y: 93 }, { x: 18, y: 18 }, { x: 56, y: 56 }];

// ---------------------------------------------------------------- state
let state = 'menu', paused = false, speed = 1, diff = 1, muted = false;
let gameTime = 0, nextId = 1;
let ter = new Uint8Array(N), occ = new Int32Array(N).fill(-1), deco = new Float32Array(N);
let factions = [], units = [], buildings = [], projs = [], fx = [], decals = [];
const bmap = new Map();
let player = null, stats = { kills: 0, lost: 0, built: 0 };
let terrainCanvas = null, miniTerrain = null;
let camX = 0, camY = 0, zoom = 1;

// ---------------------------------------------------------------- audio
let actx = null;
function snd(type) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const P = {
      click: [520, 380, 'triangle', .06, .08], build: [180, 90, 'square', .07, .18], horn: [196, 220, 'sawtooth', .09, .9],
      hit: [140, 60, 'square', .04, .07], boom: [90, 30, 'sawtooth', .12, .45], win: [392, 784, 'triangle', .12, 1.2],
      lose: [220, 80, 'sawtooth', .1, 1.4], train: [660, 880, 'triangle', .05, .12], err: [140, 110, 'square', .06, .15],
    }[type];
    o.type = P[2]; o.frequency.setValueAtTime(P[0], t); o.frequency.exponentialRampToValueAtTime(P[1], t + P[4]);
    g.gain.setValueAtTime(P[3], t); g.gain.exponentialRampToValueAtTime(0.0001, t + P[4]);
    o.start(t); o.stop(t + P[4] + .02);
  } catch (e) { /* audio unavailable */ }
}
let lastHitSnd = 0;

// ---------------------------------------------------------------- map gen
function makeNoise(r, cell) {
  const gw = Math.ceil(MW / cell) + 2, gh = Math.ceil(MH / cell) + 2, g = new Float32Array(gw * gh);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => {
    const fx = x / cell, fy = y / cell, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
    return a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty;
  };
}
function blob(r, cx, cy, rad, t) {
  for (let y = Math.floor(cy - rad - 2); y <= cy + rad + 2; y++) for (let x = Math.floor(cx - rad - 2); x <= cx + rad + 2; x++) {
    if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1) continue;
    if (Math.hypot(x - cx, y - cy) < rad + (r() - .5) * 1.6) ter[y * MW + x] = t;
  }
}
function genMap(seed, nLords) {
  const r = mulberry32(seed);
  const h1 = makeNoise(r, 20), h2 = makeNoise(r, 7), m1 = makeNoise(r, 15), m2 = makeNoise(r, 5);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const h = h1(x, y) * .7 + h2(x, y) * .3, m = m1(x, y) * .65 + m2(x, y) * .35;
    let t = G;
    if (h < .27) t = W; else if (h < .31) t = S; else if (m > .64) t = F; else if (h > .73 && m < .5) t = R; else if (m < .38) t = S;
    if (x === 0 || y === 0 || x === MW - 1 || y === MH - 1) t = R;
    ter[y * MW + x] = t; deco[y * MW + x] = r();
  }
  // a winding river through the middle with fords
  let ry = 20 + r() * 10;
  for (let x = 1; x < MW - 1; x++) {
    ry += (r() - .5) * 1.4 + Math.sin(x / 9) * .5;
    const cyR = clamp(ry + x * .55, 2, MH - 3);
    for (let d = -1.4; d <= 1.4; d += 1) { const yy = Math.round(cyR + d); if (yy > 0 && yy < MH - 1) ter[yy * MW + x] = W; }
  }
  const sites = SITES.slice(0, nLords);
  for (const s of sites) {
    for (let y = s.y - 13; y <= s.y + 13; y++) for (let x = s.x - 13; x <= s.x + 13; x++) {
      if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1) continue;
      const d = Math.hypot(x - s.x, y - s.y), i = y * MW + x;
      if (d < 12) ter[i] = d < 9 ? G : (ter[i] === G ? G : S);
    }
    const toC = Math.atan2(MH / 2 - s.y, MW / 2 - s.x);
    const a1 = toC + 1.25 + (r() - .5) * .4, a2 = toC - 1.3 + (r() - .5) * .4;
    blob(r, s.x + Math.cos(a1) * 15, s.y + Math.sin(a1) * 15, 3.8, F);
    blob(r, s.x + Math.cos(a2) * 14, s.y + Math.sin(a2) * 14, 2.6, R);
  }
  // fords: guarantee every site connects to the first
  for (let k = 1; k < sites.length; k++) carveRoad(sites[0], sites[k]);
  for (let k = 2; k < sites.length; k++) carveRoad(sites[1], sites[k]);
}
function carveRoad(a, b) {
  const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y));
  for (let s = 0; s <= steps; s++) {
    const x = Math.round(a.x + (b.x - a.x) * s / steps), y = Math.round(a.y + (b.y - a.y) * s / steps);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const i = (y + dy) * MW + x + dx; if (ter[i] === W) ter[i] = S;
    }
  }
}

const TCOL = { [G]: [122, 150, 72], [S]: [214, 188, 132], [W]: [52, 104, 150], [F]: [86, 120, 58], [R]: [138, 130, 120] };
function renderTerrain() {
  terrainCanvas = document.createElement('canvas'); terrainCanvas.width = MW * TS; terrainCanvas.height = MH * TS;
  const g = terrainCanvas.getContext('2d');
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = y * MW + x, t = ter[i], c = TCOL[t], v = (deco[i] - .5) * 16;
    g.fillStyle = `rgb(${c[0] + v | 0},${c[1] + v | 0},${c[2] + v | 0})`;
    g.fillRect(x * TS, y * TS, TS, TS);
    // soft blending at shores
    if (t !== W) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const j = (y + dy) * MW + x + dx;
      if (ter[j] === W) { g.fillStyle = 'rgba(232,214,160,.55)'; g.fillRect(x * TS + (dx > 0 ? TS - 6 : 0), y * TS + (dy > 0 ? TS - 6 : 0), dx ? 6 : TS, dy ? 6 : TS); }
    }
  }
  const r = mulberry32(7);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {

// ---------------------------------------------------------------- setup
function newWorld(seed, nAI, withPlayerAI) {
  units = []; buildings = []; projs = []; fx = []; decals = []; bmap.clear(); occ.fill(-1); nextId = 1; gameTime = 0;
  const n = nAI + 1;
  genMap(seed, n); renderTerrain();
  factions = [];
  for (let i = 0; i < n; i++) {
    const def = i === 0 && withPlayerAI ? { ...LORDS[4], name: 'Ser Halbrecht', ai: true, color: '#3b82f6', dark: '#1d3f8a' } : LORDS[i];
    const f = makeFaction(i, def, SITES[i]);
    factions.push(f);
    f.keep = addBuilding(f, 'keep', f.cx - 1, f.cy - 1);
    if (f.ai) initAIPlan(f);
  }
  player = factions[0];
  // starting kit for everyone
  for (const f of factions) {
    for (let k = 0; k < 4; k++) { const ft = freeTileNear(f.id, f.cx + 2 + k % 2, f.cy + 3, 4); if (ft) spawnUnit(f, k < 2 ? 'spear' : 'archer', ft.x, ft.y); }
  }
}
function startGame() {
  diff = +document.querySelector('input[name=diff]:checked').value;
  const nAI = +document.querySelector('input[name=nai]:checked').value;
  newWorld((Math.random() * 1e9) | 0, nAI, false);
  // give the player a head start layout
  player.res = { wood: 160, stone: 90, food: 140, gold: 220 };
  state = 'play'; paused = false; speed = 1; $('spd').textContent = 'Speed 1×';
  stats = { kills: 0, lost: 0, built: 0 };
  $('overlay').style.display = 'none';
  for (const id of ['top', 'panel', 'lords']) $(id).style.display = '';
  zoom = 1; centerOn(player.cx, player.cy);
  buildPanel(); updHUD();
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { }
  snd('horn');
  banner('The Burning Valley', `${nAI} rival lords covet your lands`);
  setTimeout(() => log('Build Farms 🌾, Woodcutters 🪓 near forests and Quarries ⛏️ near rocks.', 'ok'), 1500);
  setTimeout(() => log('Then raise a Barracks ⚔️ and wall in your keep before the lords come.', 'ok'), 5000);
  for (const f of factions) if (f.ai) setTimeout(() => log(`${f.name}, ${f.def.title}: "${f.def.taunt}"`, 'war'), 9000 + f.id * 3500);
}
function endGame(win) {
  state = 'over'; $('banner').style.opacity = 0; bannerT = 0;
  snd(win ? 'win' : 'lose');
  const o = $('overlay'); o.style.display = 'flex';
  o.innerHTML = `<div class="box">
    <h1>${win ? 'Victory' : 'Defeat'}</h1>
    <div class="sub">${win ? 'The Burning Valley is yours' : 'Your keep lies in ruins'}</div>
    <p>Time: <b>${fmtT(gameTime)}</b> · Enemies slain: <b>${stats.kills}</b> · Soldiers lost: <b>${stats.lost}</b> · Structures raised: <b>${stats.built}</b></p>
    <button class="big" onclick="location.reload()">Play Again</button>
  </div>`;
}
function showMenu() {
  newWorld(1337, 4, true);
  for (const id of ['top', 'panel', 'lords']) $(id).style.display = 'none';
  const o = $('overlay');
  o.innerHTML = `<div class="box">
    <h1>Sandfire Crusade</h1>
    <div class="sub">⚔ The Burning Valley ⚔</div>
    <p>Four warlords have carved up the river valley. Build an economy, raise towering walls, train an army,
    and storm every rival keep before they storm yours.</p>
    <div class="lordsel">${LORDS.slice(1).map(l => `<div class="lc"><b style="color:${l.color}">${l.name}</b><div style="opacity:.75;font-style:italic">${l.title}</div><div style="margin-top:4px">${l.blurb}</div></div>`).join('')}</div>
    <div class="diff">
      Rivals: ${[2, 3, 4].map(n => `<label><input type="radio" name="nai" value="${n}" ${n === 4 ? 'checked' : ''}> ${n}</label>`).join(' &nbsp; ')}
      &nbsp;&nbsp;|&nbsp;&nbsp; Difficulty: ${DIFF.map((d, i) => `<label><input type="radio" name="diff" value="${i}" ${i === 1 ? 'checked' : ''}> ${d.name}</label>`).join(' &nbsp; ')}
    </div>
    <button class="big" id="go">Begin the Siege</button>
    <div class="keys">
      <kbd>WASD</kbd>/<kbd>Arrows</kbd> scroll · <kbd>Wheel</kbd> zoom · <kbd>Drag</kbd> select · <kbd>Right-click</kbd> move/attack · <kbd>Shift</kbd>+right-click attack-move<br>
      <kbd>Space</kbd> select army · <kbd>Double-click</kbd> select type · <kbd>1-9</kbd> build · <kbd>H</kbd> home · <kbd>G</kbd> go to alert · <kbd>P</kbd> pause · <kbd>Del</kbd> demolish
    </div>
  </div>`;
  $('go').onclick = startGame;
  // the menu background is a live AI-vs-AI battle
  for (const f of factions) { f.nextAttack = 25 + f.id * 8; f.attackSize = 4; f.res.gold += 400; f.res.wood += 200; f.res.stone += 200; }
}
window.__game = { step: (s) => { for (let t = 0; t < s; t += 1 / 30) step(1 / 30); }, get state() { return { gameTime, units: units.length, buildings: buildings.filter(b => !b.dead).length, factions: factions.map(f => ({ n: f.name, alive: f.alive, res: f.res, pop: f.idle + f.workers, cap: f.popCap, waves: f.waves })) }; }, startGame, get player() { return player; }, tryBuild, trainUnit };
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
